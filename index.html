<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Salgados App">

    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="manifest" href="./manifest.json">

    <title>Encomendas de Salgados</title>

    <script>
        // O tema escuro é o padrão. Se o usuário já escolheu o claro,
        // aplica a preferência antes de a página aparecer, evitando "piscar".
        try {
            if (localStorage.getItem('salgados-theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch (e) {}
    </script>

    <style>
        :root {
            color-scheme: dark;

            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --whatsapp: #25d366;
            --whatsapp-text: #052e16;

            --bg: #0f172a;
            --card: #111827;
            --item: #1e293b;
            --input-bg: #0f172a;
            --text: #f8fafc;
            --text-soft: #cbd5e1;
            --border: #334155;
            --divider: #475569;
            --shadow: rgba(0, 0, 0, 0.32);
            --theme-button: #1e293b;
        }

        html[data-theme="light"] {
            color-scheme: light;

            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --success: #16a34a;
            --whatsapp: #25d366;
            --whatsapp-text: #052e16;

            --bg: #f1f5f9;
            --card: #ffffff;
            --item: #f8fafc;
            --input-bg: #ffffff;
            --text: #1e293b;
            --text-soft: #475569;
            --border: #e2e8f0;
            --divider: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.10);
            --theme-button: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 15px;
            margin: 0;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 12px var(--shadow);
            max-width: 450px;
            margin: auto;
            transition: background-color 0.2s ease;
        }

        .header {
            display: grid;
            grid-template-columns: 42px 1fr 42px;
            align-items: center;
            margin-bottom: 18px;
        }

        .header-spacer {
            width: 42px;
            height: 42px;
        }

        h2 {
            text-align: center;
            color: var(--text);
            margin: 0;
            font-size: 1.5rem;
        }

        .theme-toggle {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--theme-button);
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-appearance: none;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-soft);
        }

        input {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: var(--input-bg);
            color: var(--text);
            -webkit-appearance: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        input::placeholder {
            color: var(--text-soft);
            opacity: 0.75;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            -webkit-appearance: none;
        }

        .btn-add {
            background: var(--primary);
            color: white;
        }

        .btn-add:active {
            background: var(--primary-hover);
        }

        .item {
            background: var(--item);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--primary);
            color: var(--text);
        }

        .item small {
            color: var(--text-soft);
        }

        .btn-del {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .total {
            font-size: 1.3em;
            font-weight: bold;
            text-align: right;
            color: var(--text);
            padding-top: 10px;
            border-top: 2px dashed var(--divider);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .actions .btn {
            margin: 0;
            min-height: 54px;
        }

        .btn-copy {
            background: var(--success);
            color: white;
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: var(--whatsapp-text);
        }

        @media (max-width: 380px) {
            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="header-spacer" aria-hidden="true"></div>
        <h2>Pedido de Salgados</h2>
        <button type="button" class="theme-toggle" id="btnTheme"
                aria-label="Mudar para tema claro" title="Mudar para tema claro">☀️</button>
    </div>

    <div class="form-group">
        <label for="nome">Salgado:</label>
        <input type="text" id="nome" placeholder="Ex: Coxinha de Frango">

        <label for="qtd">Quantidade (unid):</label>
        <input type="text" id="qtd" placeholder="Ex: 50" inputmode="numeric">

        <label for="precoCento">Preço do Cento (R$):</label>
        <input type="text" id="precoCento" placeholder="Ex: 80.00" inputmode="decimal">

        <button type="button" class="btn btn-add" id="btnAdd">Adicionar ao Pedido</button>
    </div>

    <div id="lista"></div>

    <div class="total" id="totalGeral">Total: R$ 0,00</div>

    <div class="actions">
        <button type="button" class="btn btn-copy" id="btnCopy">Copiar pedido 📋</button>
        <button type="button" class="btn btn-whatsapp" id="btnWhatsApp">Enviar pelo WhatsApp 💬</button>
    </div>
</div>

<textarea id="tempCopy" readonly style="position: absolute; left: -9999px;"></textarea>

<script>
    let pedido = [];

    const btnAdd = document.getElementById('btnAdd');
    const btnCopy = document.getElementById('btnCopy');
    const btnWhatsApp = document.getElementById('btnWhatsApp');
    const btnTheme = document.getElementById('btnTheme');
    const themeColorMeta = document.querySelector('meta[name="theme-color"]');

    function temaAtual() {
        return document.documentElement.getAttribute('data-theme') === 'light'
            ? 'light'
            : 'dark';
    }

    function atualizarControleTema() {
        const claro = temaAtual() === 'light';

        btnTheme.textContent = claro ? '🌙' : '☀️';
        btnTheme.setAttribute(
            'aria-label',
            claro ? 'Mudar para tema escuro' : 'Mudar para tema claro'
        );
        btnTheme.title = claro ? 'Mudar para tema escuro' : 'Mudar para tema claro';

        if (themeColorMeta) {
            themeColorMeta.setAttribute('content', claro ? '#f1f5f9' : '#0f172a');
        }
    }

    btnTheme.addEventListener('click', function() {
        const novoTema = temaAtual() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', novoTema);

        try {
            localStorage.setItem('salgados-theme', novoTema);
        } catch (e) {}

        atualizarControleTema();
    });

    atualizarControleTema();

    btnAdd.addEventListener('click', function() {
        const nome = document.getElementById('nome').value;
        const qtdStr = document.getElementById('qtd').value.replace(',', '.');
        const precoStr = document.getElementById('precoCento').value.replace(',', '.');

        const qtd = parseFloat(qtdStr);
        const precoCento = parseFloat(precoStr);

        if (!nome || isNaN(qtd) || isNaN(precoCento)) {
            alert("Preencha todos os campos!");
            return;
        }

        const subtotal = (qtd / 100) * precoCento;
        pedido.push({ id: Date.now(), nome, qtd, precoCento, subtotal });

        atualizarTela();

        document.getElementById('nome').value = '';
        document.getElementById('qtd').value = '';
        document.getElementById('nome').focus();
    });

    function remover(id) {
        pedido = pedido.filter(i => i.id !== id);
        atualizarTela();
    }

    function atualizarTela() {
        const listaDiv = document.getElementById('lista');
        listaDiv.innerHTML = '';
        let total = 0;

        pedido.forEach(item => {
            total += item.subtotal;

            const div = document.createElement('div');
            div.className = 'item';

            const info = document.createElement('div');
            const strong = document.createElement('strong');
            const small = document.createElement('small');
            const br = document.createElement('br');
            const botaoRemover = document.createElement('button');

            strong.textContent = `${item.qtd}x ${item.nome}`;
            small.textContent = `Sub: R$ ${item.subtotal.toFixed(2).replace('.', ',')}`;

            botaoRemover.className = 'btn-del';
            botaoRemover.type = 'button';
            botaoRemover.textContent = 'X';
            botaoRemover.setAttribute('aria-label', `Remover ${item.nome}`);
            botaoRemover.addEventListener('click', () => remover(item.id));

            info.appendChild(strong);
            info.appendChild(br);
            info.appendChild(small);

            div.appendChild(info);
            div.appendChild(botaoRemover);
            listaDiv.appendChild(div);
        });

        document.getElementById('totalGeral').innerText =
            `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    function montarTextoPedido() {
        if (pedido.length === 0) return null;

        let texto = "*RESUMO DO PEDIDO*\n\n";
        let totalFinal = 0;

        pedido.forEach(item => {
            totalFinal += item.subtotal;
            texto += `• ${item.qtd}x ${item.nome}: R$ ${item.subtotal.toFixed(2).replace('.', ',')}\n`;
        });

        texto += `\n*TOTAL: R$ ${totalFinal.toFixed(2).replace('.', ',')}*`;
        return texto;
    }

    btnCopy.addEventListener('click', async function() {
        const texto = montarTextoPedido();

        if (!texto) {
            alert("Pedido vazio!");
            return;
        }

        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(texto);
                alert("Pedido copiado com sucesso!");
                return;
            }
        } catch (erro) {
            console.warn('Clipboard API indisponível; usando método alternativo.', erro);
        }

        const temp = document.getElementById('tempCopy');
        temp.value = texto;
        temp.select();
        temp.setSelectionRange(0, 99999);
        document.execCommand('copy');
        alert("Pedido copiado!");
    });

    btnWhatsApp.addEventListener('click', function() {
        const texto = montarTextoPedido();

        if (!texto) {
            alert("Pedido vazio!");
            return;
        }

        // Link oficial sem número: abre o WhatsApp com a mensagem pronta
        // e permite escolher para qual contato/conversa ela será enviada.
        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(texto)}`;
        window.location.href = whatsappUrl;
    });

    // REGISTO DO SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .then(() => console.log('Offline Ready!'))
                .catch(err => console.log('SW Error', err));
        });
    }
</script>

</body>
</html>
