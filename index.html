<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Salgados App">

    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="manifest" href="./manifest.json">

    <title>Encomendas de Salgados</title>

    <script>
        try {
            if (localStorage.getItem('salgados-theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch (e) {}
    </script>

    <style>
        :root {
            color-scheme: dark;

            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-soft: #7f1d1d;
            --success: #22c55e;
            --whatsapp: #25d366;
            --whatsapp-text: #052e16;
            --warning: #f59e0b;

            --bg: #0f172a;
            --card: #111827;
            --item: #1e293b;
            --input-bg: #0f172a;
            --text: #f8fafc;
            --text-soft: #cbd5e1;
            --border: #334155;
            --divider: #475569;
            --shadow: rgba(0, 0, 0, 0.32);
            --theme-button: #1e293b;
            --overlay: rgba(0, 0, 0, 0.68);
        }

        html[data-theme="light"] {
            color-scheme: light;

            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --danger-soft: #fee2e2;
            --success: #16a34a;
            --whatsapp: #25d366;
            --whatsapp-text: #052e16;
            --warning: #d97706;

            --bg: #f1f5f9;
            --card: #ffffff;
            --item: #f8fafc;
            --input-bg: #ffffff;
            --text: #1e293b;
            --text-soft: #475569;
            --border: #e2e8f0;
            --divider: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.10);
            --theme-button: #e2e8f0;
            --overlay: rgba(15, 23, 42, 0.50);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 15px;
            margin: 0;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        button, input, textarea {
            font: inherit;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 12px var(--shadow);
            max-width: 480px;
            margin: auto;
            transition: background-color 0.2s ease;
        }

        .header {
            display: grid;
            grid-template-columns: 42px 1fr 42px;
            align-items: center;
            margin-bottom: 14px;
        }

        .header-spacer {
            width: 42px;
            height: 42px;
        }

        h2 {
            text-align: center;
            color: var(--text);
            margin: 0;
            font-size: 1.5rem;
        }

        .theme-toggle {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--theme-button);
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-appearance: none;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 18px;
            background: var(--item);
            padding: 5px;
            border-radius: 12px;
        }

        .tab {
            border: 0;
            border-radius: 9px;
            padding: 11px 8px;
            background: transparent;
            color: var(--text-soft);
            font-weight: 700;
            cursor: pointer;
        }

        .tab.active {
            background: var(--primary);
            color: #fff;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .section-title {
            margin: 4px 0 12px;
            font-size: 0.9rem;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .two-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-soft);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: var(--input-bg);
            color: var(--text);
            -webkit-appearance: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--text-soft);
            opacity: 0.72;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            -webkit-appearance: none;
        }

        .btn-add {
            background: var(--primary);
            color: white;
            margin-bottom: 16px;
        }

        .btn-add:active {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--item);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-save {
            background: var(--warning);
            color: #111827;
        }

        .btn-copy {
            background: var(--success);
            color: white;
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: var(--whatsapp-text);
        }

        .btn-clear {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .item {
            background: var(--item);
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--primary);
            color: var(--text);
        }

        .item-info {
            min-width: 0;
            flex: 1;
        }

        .item-info strong {
            overflow-wrap: anywhere;
        }

        .item small {
            color: var(--text-soft);
        }

        .item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            border: none;
            min-width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
        }

        .btn-edit {
            background: var(--primary);
            color: white;
        }

        .btn-del {
            background: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            color: var(--text-soft);
            padding: 18px 10px;
            background: var(--item);
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .total {
            font-size: 1.3em;
            font-weight: bold;
            text-align: right;
            color: var(--text);
            padding-top: 12px;
            border-top: 2px dashed var(--divider);
        }

        .save-status {
            text-align: right;
            min-height: 20px;
            margin: 6px 0 12px;
            font-size: 12px;
            color: var(--text-soft);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .actions-single {
            margin-top: 10px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-card {
            background: var(--item);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px;
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .history-client {
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .history-date {
            color: var(--text-soft);
            font-size: 12px;
            text-align: right;
            flex-shrink: 0;
        }

        .history-summary {
            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .history-total {
            color: var(--text);
            font-weight: 800;
        }

        .history-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }

        .history-actions .btn {
            padding: 10px 8px;
            font-size: 13px;
        }

        .history-delete {
            color: var(--danger);
            border-color: var(--danger);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            padding: 18px;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: min(100%, 440px);
            background: var(--card);
            color: var(--text);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,.35);
            padding: 18px;
        }

        .modal h3 {
            margin: 0 0 15px;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        @media (max-width: 400px) {
            .two-fields,
            .actions,
            .history-actions,
            .modal-actions {
                grid-template-columns: 1fr;
            }

            .history-top {
                flex-direction: column;
            }

            .history-date {
                text-align: left;
            }
        }
    </style>
</head>

<body>

<div class="card">
    <div class="header">
        <div class="header-spacer" aria-hidden="true"></div>
        <h2>Pedido de Salgados</h2>
        <button type="button" class="theme-toggle" id="btnTheme"
                aria-label="Mudar para tema claro" title="Mudar para tema claro">☀️</button>
    </div>

    <div class="tabs" role="tablist" aria-label="Navegação principal">
        <button type="button" class="tab active" id="tabPedido" role="tab" aria-selected="true">🧾 Pedido</button>
        <button type="button" class="tab" id="tabHistorico" role="tab" aria-selected="false">📚 Histórico</button>
    </div>

    <section class="view active" id="viewPedido">
        <div class="section-title">Dados do cliente</div>

        <div class="form-group">
            <label for="cliente">Cliente (opcional):</label>
            <input type="text" id="cliente" placeholder="Ex: Maria">

            <label for="observacoes">Observações (opcional):</label>
            <textarea id="observacoes" placeholder="Ex: Entregar às 18h, sem queijo..."></textarea>
        </div>

        <div class="section-title">Adicionar salgado</div>

        <div class="form-group">
            <label for="nome">Salgado:</label>
            <input type="text" id="nome" placeholder="Ex: Coxinha de Frango">

            <div class="two-fields">
                <div>
                    <label for="qtd">Quantidade (unid):</label>
                    <input type="text" id="qtd" placeholder="Ex: 50" inputmode="numeric">
                </div>

                <div>
                    <label for="precoCento">Preço do Cento (R$):</label>
                    <input type="text" id="precoCento" placeholder="Ex: 80,00" inputmode="decimal">
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-add" id="btnAdd">Adicionar ao Pedido</button>

        <div id="lista"></div>

        <div class="total" id="totalGeral">Total: R$ 0,00</div>
        <div class="save-status" id="saveStatus">Rascunho salvo automaticamente</div>

        <div class="actions">
            <button type="button" class="btn btn-save" id="btnSaveHistory">Salvar no histórico 💾</button>
            <button type="button" class="btn btn-clear" id="btnClear">Limpar pedido 🗑️</button>
        </div>

        <div class="actions">
            <button type="button" class="btn btn-copy" id="btnCopy">Copiar pedido 📋</button>
            <button type="button" class="btn btn-whatsapp" id="btnWhatsApp">Enviar pelo WhatsApp 💬</button>
        </div>
    </section>

    <section class="view" id="viewHistorico">
        <div class="section-title">Pedidos salvos neste aparelho</div>
        <div id="historicoLista" class="history-list"></div>
    </section>
</div>

<textarea id="tempCopy" readonly style="position: absolute; left: -9999px;"></textarea>

<div class="modal-overlay" id="editModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
        <h3 id="editTitle">Editar item</h3>

        <div class="form-group">
            <label for="editNome">Salgado:</label>
            <input type="text" id="editNome">

            <label for="editQtd">Quantidade:</label>
            <input type="text" id="editQtd" inputmode="numeric">

            <label for="editPreco">Preço do Cento (R$):</label>
            <input type="text" id="editPreco" inputmode="decimal">
        </div>

        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="btnCancelEdit">Cancelar</button>
            <button type="button" class="btn btn-add" id="btnConfirmEdit" style="margin:0;">Salvar alteração</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_DRAFT = 'salgados-draft-v1';
    const STORAGE_HISTORY = 'salgados-history-v1';

    let pedido = [];
    let historico = [];
    let historicoIdAtual = null;
    let itemEmEdicao = null;

    const el = id => document.getElementById(id);

    const btnAdd = el('btnAdd');
    const btnCopy = el('btnCopy');
    const btnWhatsApp = el('btnWhatsApp');
    const btnTheme = el('btnTheme');
    const btnClear = el('btnClear');
    const btnSaveHistory = el('btnSaveHistory');
    const themeColorMeta = document.querySelector('meta[name="theme-color"]');

    function moeda(valor) {
        return Number(valor || 0).toFixed(2).replace('.', ',');
    }

    function numero(valor) {
        return parseFloat(String(valor).trim().replace(',', '.'));
    }

    function temaAtual() {
        return document.documentElement.getAttribute('data-theme') === 'light'
            ? 'light'
            : 'dark';
    }

    function atualizarControleTema() {
        const claro = temaAtual() === 'light';

        btnTheme.textContent = claro ? '🌙' : '☀️';
        btnTheme.setAttribute(
            'aria-label',
            claro ? 'Mudar para tema escuro' : 'Mudar para tema claro'
        );
        btnTheme.title = claro ? 'Mudar para tema escuro' : 'Mudar para tema claro';

        if (themeColorMeta) {
            themeColorMeta.setAttribute('content', claro ? '#f1f5f9' : '#0f172a');
        }
    }

    btnTheme.addEventListener('click', function() {
        const novoTema = temaAtual() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', novoTema);

        try {
            localStorage.setItem('salgados-theme', novoTema);
        } catch (e) {}

        atualizarControleTema();
    });

    atualizarControleTema();

    function abrirAba(nome) {
        const pedidoAtivo = nome === 'pedido';

        el('tabPedido').classList.toggle('active', pedidoAtivo);
        el('tabHistorico').classList.toggle('active', !pedidoAtivo);
        el('viewPedido').classList.toggle('active', pedidoAtivo);
        el('viewHistorico').classList.toggle('active', !pedidoAtivo);

        el('tabPedido').setAttribute('aria-selected', String(pedidoAtivo));
        el('tabHistorico').setAttribute('aria-selected', String(!pedidoAtivo));

        if (!pedidoAtivo) atualizarHistoricoTela();
    }

    el('tabPedido').addEventListener('click', () => abrirAba('pedido'));
    el('tabHistorico').addEventListener('click', () => abrirAba('historico'));

    function dadosDoRascunho() {
        return {
            pedido,
            cliente: el('cliente').value,
            observacoes: el('observacoes').value,
            historicoIdAtual,
            salvoEm: Date.now()
        };
    }

    function salvarRascunho() {
        try {
            localStorage.setItem(STORAGE_DRAFT, JSON.stringify(dadosDoRascunho()));
            el('saveStatus').textContent = 'Rascunho salvo automaticamente';
        } catch (e) {
            el('saveStatus').textContent = 'Não foi possível salvar o rascunho neste navegador';
        }
    }

    function carregarRascunho() {
        try {
            const bruto = localStorage.getItem(STORAGE_DRAFT);
            if (!bruto) return;

            const dados = JSON.parse(bruto);

            pedido = Array.isArray(dados.pedido) ? dados.pedido : [];
            el('cliente').value = typeof dados.cliente === 'string' ? dados.cliente : '';
            el('observacoes').value = typeof dados.observacoes === 'string' ? dados.observacoes : '';
            historicoIdAtual = dados.historicoIdAtual ?? null;
        } catch (e) {
            pedido = [];
            historicoIdAtual = null;
        }
    }

    function carregarHistorico() {
        try {
            const bruto = localStorage.getItem(STORAGE_HISTORY);
            historico = bruto ? JSON.parse(bruto) : [];
            if (!Array.isArray(historico)) historico = [];
        } catch (e) {
            historico = [];
        }
    }

    function salvarHistoricoStorage() {
        try {
            localStorage.setItem(STORAGE_HISTORY, JSON.stringify(historico));
        } catch (e) {
            alert('Não foi possível salvar o histórico neste navegador.');
        }
    }

    function marcarPedidoAlterado() {
        salvarRascunho();
        atualizarTextoBotaoHistorico();
    }

    el('cliente').addEventListener('input', marcarPedidoAlterado);
    el('observacoes').addEventListener('input', marcarPedidoAlterado);

    btnAdd.addEventListener('click', function() {
        const nome = el('nome').value.trim();
        const qtd = numero(el('qtd').value);
        const precoCento = numero(el('precoCento').value);

        if (!nome || isNaN(qtd) || isNaN(precoCento) || qtd <= 0 || precoCento < 0) {
            alert('Preencha corretamente o salgado, a quantidade e o preço.');
            return;
        }

        const subtotal = (qtd / 100) * precoCento;

        pedido.push({
            id: Date.now() + Math.floor(Math.random() * 1000),
            nome,
            qtd,
            precoCento,
            subtotal
        });

        atualizarTela();
        salvarRascunho();

        el('nome').value = '';
        el('qtd').value = '';
        el('precoCento').value = '';
        el('nome').focus();
    });

    function remover(id) {
        pedido = pedido.filter(item => item.id !== id);
        atualizarTela();
        salvarRascunho();
    }

    function abrirEdicao(id) {
        const item = pedido.find(item => item.id === id);
        if (!item) return;

        itemEmEdicao = id;
        el('editNome').value = item.nome;
        el('editQtd').value = item.qtd;
        el('editPreco').value = String(item.precoCento).replace('.', ',');

        el('editModal').classList.add('open');
        el('editModal').setAttribute('aria-hidden', 'false');
        el('editNome').focus();
    }

    function fecharEdicao() {
        itemEmEdicao = null;
        el('editModal').classList.remove('open');
        el('editModal').setAttribute('aria-hidden', 'true');
    }

    el('btnCancelEdit').addEventListener('click', fecharEdicao);

    el('editModal').addEventListener('click', event => {
        if (event.target === el('editModal')) fecharEdicao();
    });

    el('btnConfirmEdit').addEventListener('click', function() {
        const item = pedido.find(item => item.id === itemEmEdicao);
        if (!item) return fecharEdicao();

        const nome = el('editNome').value.trim();
        const qtd = numero(el('editQtd').value);
        const precoCento = numero(el('editPreco').value);

        if (!nome || isNaN(qtd) || isNaN(precoCento) || qtd <= 0 || precoCento < 0) {
            alert('Preencha corretamente os dados do item.');
            return;
        }

        item.nome = nome;
        item.qtd = qtd;
        item.precoCento = precoCento;
        item.subtotal = (qtd / 100) * precoCento;

        fecharEdicao();
        atualizarTela();
        salvarRascunho();
    });

    function atualizarTela() {
        const listaDiv = el('lista');
        listaDiv.innerHTML = '';

        if (pedido.length === 0) {
            const vazio = document.createElement('div');
            vazio.className = 'empty-state';
            vazio.textContent = 'Nenhum salgado adicionado ainda.';
            listaDiv.appendChild(vazio);
        }

        let total = 0;

        pedido.forEach(item => {
            total += item.subtotal;

            const div = document.createElement('div');
            div.className = 'item';

            const info = document.createElement('div');
            info.className = 'item-info';

            const strong = document.createElement('strong');
            strong.textContent = `${item.qtd}x ${item.nome}`;

            const br = document.createElement('br');

            const small = document.createElement('small');
            small.textContent = `Sub: R$ ${moeda(item.subtotal)}`;

            const actions = document.createElement('div');
            actions.className = 'item-actions';

            const editar = document.createElement('button');
            editar.className = 'icon-btn btn-edit';
            editar.type = 'button';
            editar.textContent = '✏️';
            editar.title = 'Editar item';
            editar.setAttribute('aria-label', `Editar ${item.nome}`);
            editar.addEventListener('click', () => abrirEdicao(item.id));

            const excluir = document.createElement('button');
            excluir.className = 'icon-btn btn-del';
            excluir.type = 'button';
            excluir.textContent = '✕';
            excluir.title = 'Remover item';
            excluir.setAttribute('aria-label', `Remover ${item.nome}`);
            excluir.addEventListener('click', () => remover(item.id));

            info.appendChild(strong);
            info.appendChild(br);
            info.appendChild(small);

            actions.appendChild(editar);
            actions.appendChild(excluir);

            div.appendChild(info);
            div.appendChild(actions);
            listaDiv.appendChild(div);
        });

        el('totalGeral').innerText = `Total: R$ ${moeda(total)}`;
        atualizarTextoBotaoHistorico();
    }

    function totalPedido(itens = pedido) {
        return itens.reduce((soma, item) => soma + Number(item.subtotal || 0), 0);
    }

    function montarTextoPedido(dados = null) {
        const itens = dados ? dados.itens : pedido;
        const cliente = dados ? dados.cliente : el('cliente').value.trim();
        const observacoes = dados ? dados.observacoes : el('observacoes').value.trim();

        if (!itens || itens.length === 0) return null;

        let texto = cliente
            ? `*PEDIDO — ${cliente}*\n\n`
            : '*RESUMO DO PEDIDO*\n\n';

        itens.forEach(item => {
            texto += `• ${item.qtd}x ${item.nome}: R$ ${moeda(item.subtotal)}\n`;
        });

        texto += `\n*TOTAL: R$ ${moeda(totalPedido(itens))}*`;

        if (observacoes) {
            texto += `\n\n*OBSERVAÇÕES:*\n${observacoes}`;
        }

        return texto;
    }

    async function copiarTexto(texto) {
        if (!texto) {
            alert('Pedido vazio!');
            return false;
        }

        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(texto);
                return true;
            }
        } catch (erro) {
            console.warn('Clipboard API indisponível; usando método alternativo.', erro);
        }

        const temp = el('tempCopy');
        temp.value = texto;
        temp.select();
        temp.setSelectionRange(0, 99999);

        try {
            return document.execCommand('copy');
        } catch (e) {
            return false;
        }
    }

    btnCopy.addEventListener('click', async function() {
        const ok = await copiarTexto(montarTextoPedido());
        alert(ok ? 'Pedido copiado com sucesso!' : 'Não foi possível copiar o pedido.');
    });

    function abrirWhatsApp(texto) {
        if (!texto) {
            alert('Pedido vazio!');
            return;
        }

        window.location.href = `https://wa.me/?text=${encodeURIComponent(texto)}`;
    }

    btnWhatsApp.addEventListener('click', function() {
        abrirWhatsApp(montarTextoPedido());
    });

    function novoPedidoVazio() {
        return pedido.length === 0 &&
               !el('cliente').value.trim() &&
               !el('observacoes').value.trim();
    }

    function limparPedido(confirmar = true) {
        if (confirmar && !novoPedidoVazio()) {
            const ok = confirm('Deseja limpar o pedido atual? O histórico já salvo não será apagado.');
            if (!ok) return false;
        }

        pedido = [];
        historicoIdAtual = null;

        el('cliente').value = '';
        el('observacoes').value = '';
        el('nome').value = '';
        el('qtd').value = '';
        el('precoCento').value = '';

        atualizarTela();
        salvarRascunho();
        return true;
    }

    btnClear.addEventListener('click', () => limparPedido(true));

    function criarSnapshotPedido() {
        return {
            id: historicoIdAtual || Date.now(),
            cliente: el('cliente').value.trim(),
            observacoes: el('observacoes').value.trim(),
            itens: pedido.map(item => ({ ...item })),
            total: totalPedido(),
            atualizadoEm: Date.now()
        };
    }

    function atualizarTextoBotaoHistorico() {
        btnSaveHistory.textContent = historicoIdAtual
            ? 'Atualizar histórico 💾'
            : 'Salvar no histórico 💾';
    }

    btnSaveHistory.addEventListener('click', function() {
        if (pedido.length === 0) {
            alert('Adicione pelo menos um salgado antes de salvar.');
            return;
        }

        const snapshot = criarSnapshotPedido();
        const indice = historico.findIndex(item => item.id === snapshot.id);

        if (indice >= 0) {
            snapshot.criadoEm = historico[indice].criadoEm || snapshot.atualizadoEm;
            historico[indice] = snapshot;
        } else {
            snapshot.criadoEm = snapshot.atualizadoEm;
            historico.unshift(snapshot);
        }

        historico.sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0));
        historicoIdAtual = snapshot.id;

        salvarHistoricoStorage();
        salvarRascunho();
        atualizarTextoBotaoHistorico();
        atualizarHistoricoTela();

        alert(indice >= 0 ? 'Pedido atualizado no histórico!' : 'Pedido salvo no histórico!');
    });

    function formatarData(timestamp) {
        try {
            return new Date(timestamp).toLocaleString('pt-BR', {
                dateStyle: 'short',
                timeStyle: 'short'
            });
        } catch (e) {
            return new Date(timestamp).toLocaleString('pt-BR');
        }
    }

    function atualizarHistoricoTela() {
        const lista = el('historicoLista');
        lista.innerHTML = '';

        if (historico.length === 0) {
            const vazio = document.createElement('div');
            vazio.className = 'empty-state';
            vazio.textContent = 'Nenhum pedido salvo no histórico.';
            lista.appendChild(vazio);
            return;
        }

        historico.forEach(registro => {
            const card = document.createElement('div');
            card.className = 'history-card';

            const top = document.createElement('div');
            top.className = 'history-top';

            const cliente = document.createElement('div');
            cliente.className = 'history-client';
            cliente.textContent = registro.cliente || 'Cliente não informado';

            const data = document.createElement('div');
            data.className = 'history-date';
            data.textContent = formatarData(registro.atualizadoEm || registro.criadoEm);

            top.appendChild(cliente);
            top.appendChild(data);

            const resumo = document.createElement('div');
            resumo.className = 'history-summary';

            const quantidadeItens = Array.isArray(registro.itens) ? registro.itens.length : 0;
            const total = Number(registro.total ?? totalPedido(registro.itens || []));

            const linhaResumo = document.createElement('div');
            linhaResumo.textContent = `${quantidadeItens} ${quantidadeItens === 1 ? 'item' : 'itens'}`;

            const linhaTotal = document.createElement('div');
            linhaTotal.className = 'history-total';
            linhaTotal.textContent = `Total: R$ ${moeda(total)}`;

            resumo.appendChild(linhaResumo);
            resumo.appendChild(linhaTotal);

            const actions = document.createElement('div');
            actions.className = 'history-actions';

            const reabrir = document.createElement('button');
            reabrir.type = 'button';
            reabrir.className = 'btn btn-secondary';
            reabrir.textContent = 'Reabrir 📝';
            reabrir.addEventListener('click', () => reabrirPedido(registro.id));

            const copiar = document.createElement('button');
            copiar.type = 'button';
            copiar.className = 'btn btn-copy';
            copiar.textContent = 'Copiar 📋';
            copiar.addEventListener('click', async () => {
                const ok = await copiarTexto(montarTextoPedido(registro));
                alert(ok ? 'Pedido copiado com sucesso!' : 'Não foi possível copiar o pedido.');
            });

            const whatsapp = document.createElement('button');
            whatsapp.type = 'button';
            whatsapp.className = 'btn btn-whatsapp';
            whatsapp.textContent = 'WhatsApp 💬';
            whatsapp.addEventListener('click', () => abrirWhatsApp(montarTextoPedido(registro)));

            const excluir = document.createElement('button');
            excluir.type = 'button';
            excluir.className = 'btn btn-secondary history-delete';
            excluir.textContent = 'Excluir 🗑️';
            excluir.addEventListener('click', () => excluirHistorico(registro.id));

            actions.appendChild(reabrir);
            actions.appendChild(copiar);
            actions.appendChild(whatsapp);
            actions.appendChild(excluir);

            card.appendChild(top);
            card.appendChild(resumo);
            card.appendChild(actions);
            lista.appendChild(card);
        });
    }

    function reabrirPedido(id) {
        const registro = historico.find(item => item.id === id);
        if (!registro) return;

        if (!novoPedidoVazio() && historicoIdAtual !== id) {
            const ok = confirm('Abrir este pedido substituirá o rascunho atual. Deseja continuar?');
            if (!ok) return;
        }

        pedido = Array.isArray(registro.itens)
            ? registro.itens.map(item => ({ ...item }))
            : [];

        el('cliente').value = registro.cliente || '';
        el('observacoes').value = registro.observacoes || '';
        historicoIdAtual = registro.id;

        atualizarTela();
        salvarRascunho();
        abrirAba('pedido');
    }

    function excluirHistorico(id) {
        const registro = historico.find(item => item.id === id);
        if (!registro) return;

        const nome = registro.cliente || 'este pedido';
        const ok = confirm(`Deseja excluir ${nome} do histórico?`);
        if (!ok) return;

        historico = historico.filter(item => item.id !== id);

        if (historicoIdAtual === id) {
            historicoIdAtual = null;
            salvarRascunho();
            atualizarTextoBotaoHistorico();
        }

        salvarHistoricoStorage();
        atualizarHistoricoTela();
    }

    carregarHistorico();
    carregarRascunho();
    atualizarTela();
    atualizarHistoricoTela();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .then(() => console.log('Offline Ready!'))
                .catch(err => console.log('SW Error', err));
        });
    }
</script>
